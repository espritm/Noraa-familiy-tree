name: Sync private family data

run-name: Sync the private family dataset

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC_DATA to confirm the private dataset update
        required: true
        type: string
      backup_confirmed:
        description: I confirm that the current private dataset has been backed up
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  sync:
    if: inputs.confirmation == 'SYNC_DATA' && inputs.backup_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Restore and validate the private dataset
        env:
          FAMILY_DATA_B64: ${{ secrets.OVH_FAMILY_DATA_B64 }}
          FAMILY_DATA_FILE: ${{ runner.temp }}/family.json
        run: |
          test -n "${FAMILY_DATA_B64}"
          printf '%s' "${FAMILY_DATA_B64}" | base64 --decode > "${FAMILY_DATA_FILE}"
          chmod 600 "${FAMILY_DATA_FILE}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['FAMILY_DATA_FILE'])
          dataset = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(dataset.get('people'), list) or not dataset['people']:
              raise SystemExit('The private dataset must contain at least one person.')
          if not isinstance(dataset.get('parentage'), list):
              raise SystemExit('The private dataset must contain a parentage collection.')
          PY

      - name: Configure trusted SSH host key
        env:
          OVH_SFTP_HOST_KEY: ${{ secrets.OVH_SFTP_HOST_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${OVH_SFTP_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload and verify the private dataset
        env:
          SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.OVH_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.OVH_REMOTE_PATH }}
          SOURCE_DATA_FILE: ${{ runner.temp }}/family.json
          REMOTE_DATA_COPY: ${{ runner.temp }}/remote-family.json
        run: |
          case "${REMOTE_PATH}" in
            ''|'/'|'.'|'..'|*'/../'*|../*|*/..)
              echo 'The configured remote path is unsafe.' >&2
              exit 1
              ;;
          esac

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          export LFTP_COMMAND_FILE="${RUNNER_TEMP}/sync-family-data.lftp"
          trap 'rm -f "${LFTP_COMMAND_FILE}" "${SOURCE_DATA_FILE}" "${REMOTE_DATA_COPY}"' EXIT

          python3 - <<'PY'
          import os
          from pathlib import Path

          def quote(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'

          command_file = Path(os.environ['LFTP_COMMAND_FILE'])
          known_hosts = Path.home() / '.ssh' / 'known_hosts'
          endpoint = f"sftp://{os.environ['SFTP_HOST']}:{os.environ['SFTP_PORT']}"
          remote_directory = f"{os.environ['REMOTE_PATH'].rstrip('/')}/storage/app/private"
          remote_data = f"{remote_directory}/family.json"
          commands = [
              'set cmd:fail-exit yes;',
              'set net:max-retries 2;',
              'set net:timeout 20;',
              f"set sftp:connect-program {quote(f'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile={known_hosts}')};",
              f"open -u {quote(os.environ['SFTP_USERNAME'])},{quote(os.environ['SFTP_PASSWORD'])} {quote(endpoint)};",
              f"put {quote(os.environ['SOURCE_DATA_FILE'])} -o {quote(remote_data)};",
              f"get {quote(remote_data)} -o {quote(os.environ['REMOTE_DATA_COPY'])};",
          ]
          command_file.write_text('\n'.join(commands) + '\n', encoding='utf-8')
          command_file.chmod(0o600)
          PY

          lftp -f "${LFTP_COMMAND_FILE}"
          cmp --silent "${SOURCE_DATA_FILE}" "${REMOTE_DATA_COPY}"
